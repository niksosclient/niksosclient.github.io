<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Профиль — Niksos Client</title>
<link rel="icon" href="assets/favicon.png?v=20">
<style>
:root{
  --bg:#0a0a0a;--surface:#111;--surface2:#171717;--line:rgba(255,255,255,.09);
  --text:#fff;--muted:rgba(255,255,255,.58);--dim:rgba(255,255,255,.35);
  --green:#5dffa5;--yellow:#ffd855;--red:#ff6b6b;--purple:#c084fc;
  --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
.wrap{max-width:900px;margin:0 auto;padding:0 24px}

/* nav */
.nav{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;gap:8px;padding:12px 24px;background:rgba(10,10,10,.75);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.nav .brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px}
.nav .brand img{width:26px;height:26px;border-radius:6px}
.nav a.back{margin-left:auto;font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:6px 14px;transition:.2s}
.nav a.back:hover{color:#fff;background:rgba(255,255,255,.07)}

/* page */
.page{padding:100px 0 80px}

/* state screens */
.state{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:16px;text-align:center}
.state .ico{font-size:56px;line-height:1}
.state h2{font-size:28px;font-weight:800}
.state p{color:var(--muted);max-width:380px}
.state input{background:var(--surface);border:1px solid var(--line);border-radius:10px;color:#fff;font-size:15px;padding:10px 16px;width:100%;max-width:280px;outline:none;transition:.2s}
.state input:focus{border-color:rgba(255,255,255,.3)}
.state .btn{display:inline-flex;align-items:center;gap:8px;padding:10px 24px;border-radius:10px;font-weight:700;font-size:15px;background:#fff;color:#000;cursor:pointer;border:none;transition:.2s}
.state .btn:hover{opacity:.9;transform:translateY(-1px)}

/* profile */
.profile{display:none}

/* header */
.ph{display:flex;align-items:flex-start;gap:24px;padding:28px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(140deg,var(--surface2),var(--surface));margin-bottom:20px;position:relative;overflow:hidden}
.ph::before{content:"";position:absolute;top:-60px;right:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.12),transparent 70%)}
.ph .av{width:80px;height:80px;border-radius:50%;border:2px solid var(--line);background:var(--surface2);flex:none;overflow:hidden}
.ph .av img{width:100%;height:100%;object-fit:cover}
.ph .av .fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:900;background:linear-gradient(135deg,#333,#222)}
.ph .info{flex:1;min-width:0}
.ph .info h1{font-size:clamp(22px,4vw,36px);font-weight:900;letter-spacing:-.02em;line-height:1}
.ph .info .sub{display:flex;align-items:center;gap:10px;margin-top:6px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid;white-space:nowrap}
.badge.admin{color:var(--red);border-color:rgba(255,107,107,.3);background:rgba(255,107,107,.08)}
.badge.staff{color:var(--yellow);border-color:rgba(255,216,85,.3);background:rgba(255,216,85,.08)}
.badge.user{color:var(--muted);border-color:var(--line);background:rgba(255,255,255,.04)}
.badge.online{color:var(--green);border-color:rgba(93,255,165,.3);background:rgba(93,255,165,.08)}
.ph .lastseen{font-size:13px;color:var(--dim);margin-top:4px}
.ph .since{font-size:12px;color:var(--dim);margin-top:2px}

/* stats grid */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat-card{padding:20px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);text-align:center;transition:border-color .2s}
.stat-card:hover{border-color:rgba(255,255,255,.2)}
.stat-card .val{font-size:clamp(24px,3.5vw,38px);font-weight:900;letter-spacing:-.03em;line-height:1}
.stat-card .lbl{font-size:12px;color:var(--muted);margin-top:6px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.stat-card .val.green{color:var(--green)}
.stat-card .val.yellow{color:var(--yellow)}

/* fav server */
.fav-server{display:flex;align-items:center;gap:12px;padding:16px 20px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin-bottom:20px}
.fav-server .ico{font-size:28px}
.fav-server .lbl{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.fav-server .name{font-size:20px;font-weight:800}

/* achievements */
.ach-section h2{font-size:20px;font-weight:800;margin-bottom:14px}
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-bottom:28px}
.ach{display:flex;align-items:center;gap:14px;padding:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);transition:.2s}
.ach:hover{border-color:rgba(255,255,255,.2);background:var(--surface2)}
.ach .ach-ico{font-size:30px;line-height:1;flex:none}
.ach .ach-name{font-size:15px;font-weight:700;line-height:1.2}
.ach .ach-date{font-size:12px;color:var(--dim);margin-top:3px}
.ach.locked{opacity:.35}
.ach.locked .ach-ico{filter:grayscale(1)}

/* crosshair preview */
.cross-section h2{font-size:20px;font-weight:800;margin-bottom:14px}
.cross-box{display:inline-flex;align-items:center;justify-content:center;width:160px;height:160px;border:1px solid var(--line);border-radius:var(--r);background:#111;position:relative}
.cross-box canvas{image-rendering:pixelated}

/* share */
.share-row{display:flex;align-items:center;gap:10px;margin-top:28px;padding-top:20px;border-top:1px solid var(--line)}
.share-row span{font-size:13px;color:var(--muted)}
.share-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:700;border:1px solid var(--line);background:rgba(255,255,255,.05);cursor:pointer;transition:.2s}
.share-btn:hover{background:rgba(255,255,255,.1)}

@media(max-width:600px){
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .ph{flex-direction:column}
}
</style>
</head>
<body>

<nav class="nav">
  <a class="brand" href="index.html"><img src="assets/logo-white.svg?v=20" alt="">Niksos</a>
  <a class="back" href="index.html">← Главная</a>
</nav>

<div class="page">
<div class="wrap">

  <!-- STATE: LOADING -->
  <div class="state" id="stateLoading">
    <div class="ico">⏳</div>
    <h2>Загрузка…</h2>
  </div>

  <!-- STATE: NOT FOUND -->
  <div class="state" id="stateNotFound" style="display:none">
    <div class="ico">🔍</div>
    <h2>Профиль не найден</h2>
    <p>Игрок <b id="nfName"></b> не зарегистрирован в Niksos или страница недоступна.</p>
    <a class="btn" href="index.html">На главную</a>
  </div>

  <!-- STATE: NO NICK -->
  <div class="state" id="stateNoNick" style="display:none">
    <div class="ico">👤</div>
    <h2>Введи ник</h2>
    <p>Перейди по ссылке вида <code>u.html?name=ник</code> или найди игрока ниже</p>
    <input type="text" id="nickInput" placeholder="Никнейм…" autocomplete="off" spellcheck="false">
    <button class="btn" onclick="goToNick()">Смотреть профиль</button>
  </div>

  <!-- PROFILE -->
  <div class="profile" id="profile">

    <!-- Header -->
    <div class="ph">
      <div class="av" id="avWrap">
        <div class="fallback" id="avFallback">?</div>
      </div>
      <div class="info">
        <h1 id="pName">—</h1>
        <div class="sub">
          <span class="badge user" id="pRole">Игрок</span>
          <span class="badge online" id="pOnlineBadge" style="display:none">● Онлайн</span>
        </div>
        <div class="lastseen" id="pLastSeen"></div>
        <div class="since" id="pSince"></div>
      </div>
    </div>

    <!-- Stats Grid -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="val yellow" id="pHours">0</div>
        <div class="lbl">Часы</div>
      </div>
      <div class="stat-card">
        <div class="val green" id="pKills">0</div>
        <div class="lbl">Убийства</div>
      </div>
      <div class="stat-card">
        <div class="val" id="pDeaths">0</div>
        <div class="lbl">Смерти</div>
      </div>
      <div class="stat-card">
        <div class="val purple" id="pSessions">0</div>
        <div class="lbl">Сессии</div>
      </div>
    </div>

    <!-- Fav Server -->
    <div class="fav-server">
      <div class="ico">🎮</div>
      <div>
        <div class="lbl">Любимый сервер</div>
        <div class="name" id="pFavServer">—</div>
      </div>
    </div>

    <!-- Share Row -->
    <div class="share-row">
      <span>Поделиться профилем:</span>
      <button class="share-btn" onclick="copyLink()">🔗 Скопировать ссылку</button>
    </div>

  </div>

</div>
</div>

<!-- Подключение библиотек -->
<script src="https://jsdelivr.net"></script>
<script src="assets/config.js"></script>

<script>
// ── Получение ника из Query-параметров (?name=ник) ──
function getNickFromUrl() {
  const qs = new URLSearchParams(window.location.search);
  return qs.get("name");
}

function goToNick() {
  const input = document.getElementById('nickInput');
  const name = input.value.trim();
  if (name) {
    window.location.search = '?name=' + encodeURIComponent(name);
  }
}

// ── Загрузка данных из Supabase RPC ──
async function loadProfile(nickname) {
  try {
    // Делаем запрос к созданной функции в Supabase
    const { data, error } = await supabase.rpc('niksos_public_profile', { p_name: nickname });

    if (error) throw error;

    if (!data) {
document.getElementById('stateLoading').style.display = 'none';
document.getElementById('nfName').textContent = nickname;
document.getElementById('stateNotFound').style.display = 'flex';
return;
}
renderProfile(data);
} catch (err) {
console.error("Ошибка загрузки:", err);
document.getElementById('stateLoading').style.display = 'none';
document.getElementById('nfName').textContent = nickname;
document.getElementById('stateNotFound').style.display = 'flex';
}
}
// ── Отрисовка данных на странице ──
function renderProfile(player) {
// Аватар (Первая буква ника)
const firstLetter = player.name ? player.name.charAt(0).toUpperCase() : '?';
const fallback = document.getElementById('avFallback');
if (fallback) fallback.textContent = firstLetter;
// Текстовые данные
if (document.getElementById('pName')) document.getElementById('pName').textContent = player.name;
if (document.getElementById('pHours')) document.getElementById('pHours').textContent = Math.round(player.hours) + " ч.";
if (document.getElementById('pKills')) document.getElementById('pKills').textContent = player.kills;
if (document.getElementById('pDeaths')) document.getElementById('pDeaths').textContent = player.deaths;
if (document.getElementById('pSessions')) document.getElementById('pSessions').textContent = player.sessions;
if (document.getElementById('pFavServer')) document.getElementById('pFavServer').textContent = player.fav_server || 'Не определен';
// Роли и значки
const roleBadge = document.getElementById('pRole');
if (roleBadge) {
roleBadge.textContent = player.role === 'admin' ? 'Администратор' : player.role === 'staff' ? 'Персонал' : 'Игрок';
roleBadge.className = 'badge ' + (player.role || 'user');
}
// Даты создания аккаунта и последнего входа
if (player.created && document.getElementById('pSince')) {
const d = new Date(player.created).toLocaleDateString("ru-RU", { day: 'numeric', month: 'long', year: 'numeric' });
document.getElementById('pSince').textContent = "В клубе Niksos с " + d;
}
if (player.last_seen && document.getElementById('pLastSeen')) {
const l = new Date(player.last_seen).toLocaleString("ru-RU", { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
document.getElementById('pLastSeen').textContent = "Последняя активность: " + l;
}
// Показываем блок профиля
document.getElementById('stateLoading').style.display = 'none';
document.getElementById('profile').style.display = 'block';
}
function copyLink() {
navigator.clipboard.writeText(location.href).then(() => {
const b = event.target.closest('.share-btn');
const old = b.textContent;
b.textContent = '✅ Скопировано!';
setTimeout(() => { b.textContent = old; }, 2000);
});
}
// ── Старт скрипта ──
const nick = getNickFromUrl();
if (!nick) {
  document.getElementById('stateLoading').style.display = 'none';
  document.getElementById('stateNoNick').style.display = 'flex';
} else {
  loadProfile(nick);
}
</script>
</body>
</html>
